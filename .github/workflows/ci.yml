name: CI
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -m "not emulator"
      - run: python -m compileall -q mk64_env scripts src train_sac.py train_bc.py test.py grad_cam.py GetExpertData.py ReplayExpertData.py
      - run: bash -n scripts/fetch_core.sh

  # Reports whether the libretro nightly still matches the pinned hash. The
  # buildbot keeps only the latest build, so this job fails whenever upstream
  # rebuilds the core; it never blocks the workflow.
  core-pin:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch_core.sh
